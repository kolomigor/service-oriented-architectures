apiVersion: 1

datasources:
  - name: ClickHouse
    uid: cinema-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: $CLICKHOUSE_USER
      defaultDatabase: cinema
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
