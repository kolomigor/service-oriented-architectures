name: flight-booking
services:
  flight-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight-local-password
      POSTGRES_DB: flight
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  flight-migrate:
    image: flyway/flyway:11.15.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://flight-db:5432/flight
      FLYWAY_USER: flight
      FLYWAY_PASSWORD: flight-local-password
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ./migrations/flight:/flyway/sql:ro
    depends_on:
      flight-db:
        condition: service_healthy

  flight-service:
    build:
      context: .
      args:
        SERVICE: flight-service
    environment:
      DATABASE_URL: postgres://flight:flight-local-password@flight-db:5432/flight?sslmode=disable
      GRPC_ADDR: :50051
      FLIGHT_API_KEY: flight-local-api-key
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      flight-migrate:
        condition: service_completed_successfully

  booking-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking-local-password
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  booking-migrate:
    image: flyway/flyway:11.15.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://booking-db:5432/booking
      FLYWAY_USER: booking
      FLYWAY_PASSWORD: booking-local-password
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ./migrations/booking:/flyway/sql:ro
    depends_on:
      booking-db:
        condition: service_healthy

  booking-service:
    build:
      context: .
      args:
        SERVICE: booking-service
    environment:
      DATABASE_URL: postgres://booking:booking-local-password@booking-db:5432/booking?sslmode=disable
      HTTP_ADDR: :8080
      FLIGHT_SERVICE_ADDR: flight-service:50051
      FLIGHT_API_KEY: flight-local-api-key
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight-service:
        condition: service_started

volumes:
  flight-db-data:
  booking-db-data:
