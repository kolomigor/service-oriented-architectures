<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .boundary-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #1e3a8a; }
      .element-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .element-type { font: 14px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .element-text { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .db-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .db-type { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .db-text { font: 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .relation { font: 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .legend { font: 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .container { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .planned { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 8 5; }
      .database { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .client { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .person { fill: #fefce8; stroke: #a16207; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .planned-line { stroke: #c2410c; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .async-line { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 3 7; fill: none; marker-end: url(#arrow); }
      .db-line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1400" fill="#f8fafc"/>
  <text x="60" y="48" class="title">Marketplace — C4 Container Diagram</text>
  <text x="60" y="78" class="subtitle">Containers, technology choices, data ownership and synchronous/asynchronous interactions</text>

  <rect x="225" y="115" width="1510" height="1110" rx="24" fill="#eff6ff" stroke="#1e40af" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="255" y="153" class="boundary-title">Marketplace System Boundary</text>

  <!-- People and client applications -->
  <rect x="55" y="255" width="155" height="100" rx="12" class="person"/>
  <text x="132" y="286" text-anchor="middle" class="element-title">Buyer</text>
  <text x="132" y="311" text-anchor="middle" class="element-type">[Person]</text>
  <text x="132" y="336" text-anchor="middle" class="element-text">shops for products</text>

  <rect x="55" y="760" width="155" height="100" rx="12" class="person"/>
  <text x="132" y="791" text-anchor="middle" class="element-title">Seller</text>
  <text x="132" y="816" text-anchor="middle" class="element-type">[Person]</text>
  <text x="132" y="841" text-anchor="middle" class="element-text">manages listings</text>

  <rect x="250" y="225" width="185" height="145" rx="12" class="client"/>
  <text x="342" y="259" text-anchor="middle" class="element-title">Buyer Client</text>
  <text x="342" y="286" text-anchor="middle" class="element-type">[Container: Web/Mobile]</text>
  <text x="342" y="319" text-anchor="middle" class="element-text">browse and checkout</text>
  <text x="342" y="343" text-anchor="middle" class="element-text">uses Marketplace API</text>

  <rect x="250" y="730" width="185" height="145" rx="12" class="client"/>
  <text x="342" y="764" text-anchor="middle" class="element-title">Seller Client</text>
  <text x="342" y="791" text-anchor="middle" class="element-type">[Container: Web/Mobile]</text>
  <text x="342" y="824" text-anchor="middle" class="element-text">manage products</text>
  <text x="342" y="848" text-anchor="middle" class="element-text">uses Marketplace API</text>

  <!-- Running containers -->
  <rect x="560" y="200" width="350" height="175" rx="12" class="container"/>
  <text x="735" y="237" text-anchor="middle" class="element-title">API Gateway</text>
  <text x="735" y="265" text-anchor="middle" class="element-type">[Container: Go, gRPC]</text>
  <text x="735" y="301" text-anchor="middle" class="element-text">external API and request routing</text>
  <text x="735" y="326" text-anchor="middle" class="element-text">aggregates internal responses</text>
  <text x="735" y="351" text-anchor="middle" class="element-text">HTTP /health</text>

  <rect x="1060" y="190" width="380" height="185" rx="12" class="container"/>
  <text x="1250" y="228" text-anchor="middle" class="element-title">Recommendation Service</text>
  <text x="1250" y="256" text-anchor="middle" class="element-type">[Container: Go, gRPC]</text>
  <text x="1250" y="292" text-anchor="middle" class="element-text">personal ranking and recommendation profiles</text>
  <text x="1250" y="317" text-anchor="middle" class="element-text">does not own product cards</text>
  <text x="1250" y="342" text-anchor="middle" class="element-text">HTTP /health</text>

  <rect x="1060" y="465" width="380" height="185" rx="12" class="container"/>
  <text x="1250" y="503" text-anchor="middle" class="element-title">Catalog Service</text>
  <text x="1250" y="531" text-anchor="middle" class="element-type">[Container: Go, gRPC]</text>
  <text x="1250" y="567" text-anchor="middle" class="element-text">product cards and availability</text>
  <text x="1250" y="592" text-anchor="middle" class="element-text">single owner of catalog data</text>
  <text x="1250" y="617" text-anchor="middle" class="element-text">HTTP /health</text>

  <path d="M 435 297 L 560 285" class="line"/>
  <text x="485" y="270" text-anchor="middle" class="relation">gRPC</text>
  <path d="M 435 802 L 500 802 L 560 330" class="line"/>
  <text x="480" y="775" text-anchor="middle" class="relation">gRPC</text>
  <path d="M 210 305 L 250 297" class="line"/>
  <path d="M 210 810 L 250 802" class="line"/>

  <path d="M 910 275 L 1060 275" class="line"/>
  <text x="985" y="255" text-anchor="middle" class="relation">gRPC: personalized list</text>
  <path d="M 1250 375 L 1250 465" class="line"/>
  <text x="1325" y="425" text-anchor="middle" class="relation">gRPC: catalog candidates</text>
  <path d="M 910 340 L 980 340 L 1060 550" class="line"/>
  <text x="935" y="390" text-anchor="middle" class="relation">gRPC: list / get</text>

  <!-- Planned domain containers -->
  <rect x="560" y="470" width="350" height="165" rx="12" class="planned"/>
  <text x="735" y="507" text-anchor="middle" class="element-title">User Service</text>
  <text x="735" y="535" text-anchor="middle" class="element-type">[Container: Go, gRPC — planned]</text>
  <text x="735" y="571" text-anchor="middle" class="element-text">accounts, roles, preferences and contacts</text>
  <text x="735" y="596" text-anchor="middle" class="element-text">canonical user context</text>

  <rect x="560" y="885" width="350" height="165" rx="12" class="planned"/>
  <text x="735" y="922" text-anchor="middle" class="element-title">Order Service</text>
  <text x="735" y="950" text-anchor="middle" class="element-type">[Container: Go, gRPC — planned]</text>
  <text x="735" y="986" text-anchor="middle" class="element-text">checkout and order lifecycle</text>
  <text x="735" y="1011" text-anchor="middle" class="element-text">owns order state</text>

  <rect x="1060" y="885" width="350" height="165" rx="12" class="planned"/>
  <text x="1235" y="922" text-anchor="middle" class="element-title">Payment Service</text>
  <text x="1235" y="950" text-anchor="middle" class="element-type">[Container: Go, gRPC — planned]</text>
  <text x="1235" y="986" text-anchor="middle" class="element-text">payment operations and status</text>
  <text x="1235" y="1011" text-anchor="middle" class="element-text">separate payment lifecycle</text>

  <rect x="1480" y="885" width="220" height="165" rx="12" class="planned"/>
  <text x="1590" y="922" text-anchor="middle" class="element-title">Notification</text>
  <text x="1590" y="947" text-anchor="middle" class="element-title">Service</text>
  <text x="1590" y="975" text-anchor="middle" class="element-type">[Container — planned]</text>
  <text x="1590" y="1008" text-anchor="middle" class="element-text">delivery and retries</text>

  <path d="M 735 375 L 735 470" class="planned-line"/>
  <text x="800" y="430" class="relation">gRPC: user context</text>
  <path d="M 735 635 L 735 885" class="planned-line"/>
  <text x="815" y="765" class="relation">gRPC: checkout</text>
  <path d="M 910 900 L 975 900 L 975 650 L 1060 650" class="planned-line"/>
  <text x="970" y="680" text-anchor="middle" class="relation">gRPC: validate items</text>
  <path d="M 910 968 L 1060 968" class="planned-line"/>
  <text x="985" y="945" text-anchor="middle" class="relation">gRPC: create payment</text>
  <path d="M 880 885 L 940 885 L 940 840 L 1450 840 L 1450 985 L 1480 985" class="async-line"/>
  <text x="1195" y="825" text-anchor="middle" class="relation">event: order status</text>
  <path d="M 1590 885 L 1590 180 L 500 180 L 500 550 L 560 550" class="planned-line"/>
  <text x="1010" y="170" text-anchor="middle" class="relation">gRPC: get contact data</text>

  <!-- Data stores -->
  <path d="M 735 635 L 735 695" class="db-line"/>
  <rect x="625" y="695" width="220" height="105" rx="12" class="database"/>
  <text x="735" y="727" text-anchor="middle" class="db-title">User DB</text>
  <text x="735" y="750" text-anchor="middle" class="db-type">[Container: Database]</text>
  <text x="735" y="776" text-anchor="middle" class="db-text">accounts, roles, preferences, contacts</text>

  <path d="M 1250 650 L 1250 710" class="db-line"/>
  <rect x="1125" y="710" width="250" height="105" rx="12" class="database"/>
  <text x="1250" y="742" text-anchor="middle" class="db-title">Catalog DB</text>
  <text x="1250" y="765" text-anchor="middle" class="db-type">[Container: Database]</text>
  <text x="1250" y="791" text-anchor="middle" class="db-text">products and availability</text>

  <path d="M 735 1050 L 735 1100" class="db-line"/>
  <rect x="625" y="1100" width="220" height="100" rx="12" class="database"/>
  <text x="735" y="1128" text-anchor="middle" class="db-title">Order DB</text>
  <text x="735" y="1151" text-anchor="middle" class="db-type">[Container: Database]</text>
  <text x="735" y="1176" text-anchor="middle" class="db-text">orders and statuses</text>

  <path d="M 1235 1050 L 1235 1100" class="db-line"/>
  <rect x="1125" y="1100" width="220" height="100" rx="12" class="database"/>
  <text x="1235" y="1128" text-anchor="middle" class="db-title">Payment DB</text>
  <text x="1235" y="1151" text-anchor="middle" class="db-type">[Container: Database]</text>
  <text x="1235" y="1176" text-anchor="middle" class="db-text">payment states</text>

  <path d="M 1590 1050 L 1590 1100" class="db-line"/>
  <rect x="1480" y="1100" width="220" height="100" rx="12" class="database"/>
  <text x="1590" y="1128" text-anchor="middle" class="db-title">Notification DB</text>
  <text x="1590" y="1151" text-anchor="middle" class="db-type">[Container: Database]</text>
  <text x="1590" y="1176" text-anchor="middle" class="db-text">delivery attempts</text>

  <!-- Legend -->
  <rect x="60" y="1245" width="1660" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="85" y="1275" class="element-title">Legend</text>
  <line x1="220" y1="1270" x2="320" y2="1270" class="line"/>
  <text x="335" y="1275" class="legend">solid arrow — synchronous gRPC</text>
  <line x1="560" y1="1270" x2="640" y2="1270" class="planned-line"/>
  <text x="655" y="1275" class="legend">orange dashed — planned sync gRPC</text>
  <line x1="980" y1="1270" x2="1060" y2="1270" class="async-line"/>
  <text x="1075" y="1275" class="legend">purple dashed — future async event</text>
  <rect x="1400" y="1253" width="32" height="28" class="container"/>
  <text x="1445" y="1275" class="legend">running</text>
  <rect x="1560" y="1253" width="32" height="28" class="planned"/>
  <text x="1605" y="1275" class="legend">planned</text>
</svg>
