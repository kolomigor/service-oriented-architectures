        current_uses:
          type: "integer"
          minimum: 0
          maximum: 2147483647
    RegisterRequest:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          format: "email"
          x-go-type: "string"
          minLength: 3
          maxLength: 254
        password:
          type: "string"
          minLength: 8
          maxLength: 72
          description: "Не менее 8 символов Unicode и не более 72 байт UTF-8; дополнительная проверка размера в байтах защищает ограничение bcrypt."
        role:
          type: "string"
          enum:
            - "USER"
            - "SELLER"
          default: "USER"
    LoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          format: "email"
          x-go-type: "string"
          minLength: 3
          maxLength: 254
        password:
          type: "string"
          minLength: 1
          maxLength: 72
    RefreshRequest:
      type: "object"
      additionalProperties: false
      required:
        - "refresh_token"
      properties:
        refresh_token:
          type: "string"
          minLength: 1
          maxLength: 4096
    UserResponse:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "email"
        - "role"
        - "created_at"
      properties:
        id:
          type: "string"
          format: "uuid"
          x-go-type: "string"
        email:
          type: "string"
          format: "email"
          x-go-type: "string"
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: "string"
          format: "date-time"
    TokenPair:
      type: "object"
      additionalProperties: false
      required:
        - "access_token"
        - "refresh_token"
        - "token_type"
        - "expires_in"
      properties:
        access_token:
          type: "string"
          minLength: 1
        refresh_token:
          type: "string"
          minLength: 1
        token_type:
          type: "string"
          enum:
            - "Bearer"
        expires_in:
          type: "integer"
          minimum: 1
    ErrorResponse:
      type: "object"
      additionalProperties: false
      required:
        - "error_code"
        - "message"
      properties:
        error_code:
          type: "string"
          enum:
            - "PRODUCT_NOT_FOUND"
            - "PRODUCT_INACTIVE"
            - "ORDER_NOT_FOUND"
            - "ORDER_LIMIT_EXCEEDED"
            - "ORDER_HAS_ACTIVE"
            - "INVALID_STATE_TRANSITION"
            - "INSUFFICIENT_STOCK"
            - "PROMO_CODE_INVALID"
            - "PROMO_CODE_MIN_AMOUNT"
            - "ORDER_OWNERSHIP_VIOLATION"
            - "VALIDATION_ERROR"
            - "TOKEN_EXPIRED"
            - "TOKEN_INVALID"
            - "REFRESH_TOKEN_INVALID"
            - "ACCESS_DENIED"
            - "INTERNAL_ERROR"
            - "USER_ALREADY_EXISTS"
            - "AUTH_INVALID_CREDENTIALS"
            - "PROMO_CODE_ALREADY_EXISTS"
        message:
          type: "string"
          minLength: 1
        details:
          type: "object"
          additionalProperties: true
          description: "Для VALIDATION_ERROR: fields — список объектов {field, message}. Для INSUFFICIENT_STOCK: items — список {product_id, requested, available}."
    HealthResponse:
      type: "object"
      additionalProperties: false
      required:
        - "status"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
  responses:
    ValidationError:
      description: "VALIDATION_ERROR — некорректный JSON, обязательное поле, ограничение схемы, дата или UUID. details.fields содержит конкретные поля и нарушения. Запрос отклоняется до бизнес-логики."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "TOKEN_EXPIRED — просроченный access token; TOKEN_INVALID — отсутствующий или неверный access token. AUTH_INVALID_CREDENTIALS — неправильный логин или пароль. REFRESH_TOKEN_INVALID — неверный, просроченный, отозванный или уже использованный refresh token."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccessDenied:
      description: "ACCESS_DENIED — роль не разрешает операцию или SELLER изменяет чужой товар. ORDER_OWNERSHIP_VIOLATION — пользователь обращается к чужому заказу."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "PRODUCT_NOT_FOUND — товар не существует; ORDER_NOT_FOUND — заказ не существует."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "PRODUCT_INACTIVE — товар не ACTIVE; ORDER_HAS_ACTIVE — уже есть CREATED/PAYMENT_PENDING; INVALID_STATE_TRANSITION — недопустимый статус или переход; INSUFFICIENT_STOCK — недостаточно остатков (details.items). USER_ALREADY_EXISTS — email зарегистрирован; PROMO_CODE_ALREADY_EXISTS — код промоакции занят."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PromoError:
      description: "PROMO_CODE_INVALID — промокод отсутствует, неактивен, просрочен, ещё не действует или исчерпан. PROMO_CODE_MIN_AMOUNT — исходная сумма заказа меньше min_order_amount."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OrderLimitExceeded:
      description: "ORDER_LIMIT_EXCEEDED — с предыдущей успешной CREATE_ORDER/UPDATE_ORDER прошло меньше конфигурируемых N минут. Ошибочные запросы не расходуют лимит."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "INTERNAL_ERROR — непредвиденная ошибка сервера или недоступность БД; внутренние детали и секреты не возвращаются."
      headers:
        X-Request-Id:
          description: "UUID текущего запроса, генерируется сервером."
          schema:
            type: "string"
            format: "uuid"
            x-go-type: "string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
