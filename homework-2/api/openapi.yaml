openapi: "3.0.3"
info:
  title: "Marketplace API"
  version: "1.0.0"
  description: "Контракт домашнего задания №2: товары, заказы, промокоды и JWT. Все запросы и ответы используют JSON. Цены и суммы — числа с точностью до копеек. Каждый ответ содержит X-Request-Id. Все ошибки имеют единый формат ErrorResponse. Только /auth/* и /health доступны без access token."
servers:
  -
    url: "http://localhost:8080"
    description: "Локальное приложение"
tags:
  -
    name: "Health"
  -
    name: "Auth"
  -
    name: "Products"
  -
    name: "Orders"
  -
    name: "PromoCodes"
security:
  -
    BearerAuth: []
paths:
  /health:
    get:
      tags:
        - "Health"
      operationId: "health"
      summary: "Проверить состояние сервиса"
      description: "Публичная проверка подключения приложения к PostgreSQL."
      responses:
        "200":
          description: "Приложение и БД доступны"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
      security: []
  /auth/register:
    post:
      tags:
        - "Auth"
      operationId: "register"
      summary: "Зарегистрировать пользователя"
      description: "Публичная регистрация роли USER (по умолчанию) или SELLER. ADMIN создаётся только администратором при запуске приложения. Пароль хешируется и никогда не возвращается."
      responses:
        "201":
          description: "Пользователь зарегистрирован"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      security: []
  /auth/login:
    post:
      tags:
        - "Auth"
      operationId: "login"
      summary: "Войти в систему"
      description: "Публичная аутентификация. Возвращает access token на 15–30 минут (по умолчанию 20) и refresh token на 7–30 дней (по умолчанию 14); сроки задаются конфигурацией. Оба JWT содержат role и тип токена; refresh token нельзя использовать как access token. AUTH_INVALID_CREDENTIALS возвращается при неправильном логине или пароле."
      responses:
        "200":
          description: "Пара токенов"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      security: []
  /auth/refresh:
    post:
      tags:
        - "Auth"
      operationId: "refresh"
      summary: "Обновить пару токенов"
      description: "Публичный обмен действительного refresh token на новую пару. Старый refresh token отзывается; повторное использование возвращает REFRESH_TOKEN_INVALID."
      responses:
        "200":
          description: "Новая пара токенов"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      security: []
  /products:
    post:
      tags:
        - "Products"
      operationId: "createProduct"
      summary: "Создать товар"
      description: "SELLER и ADMIN. USER получает ACCESS_DENIED. seller_id назначается текущему авторизованному пользователю; клиент не может передать ID продавца."
      responses:
        "201":
          description: "Товар создан"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
    get:
      tags:
        - "Products"
      operationId: "listProducts"
      summary: "Получить страницу товаров"
      description: "USER, SELLER и ADMIN. Нумерация страниц с 0, размер по умолчанию 20. Фильтры status и category совместимы; категория сравнивается точно, с учётом регистра. Без фильтра возвращаются все статусы, включая ARCHIVED. Порядок: created_at DESC, id ASC. totalElements учитывает фильтры без пагинации. Страница за пределами списка содержит пустой items."
      responses:
        "200":
          description: "Страница товаров"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        -
          name: "page"
          in: "query"
          description: "Номер страницы, начиная с 0."
          schema:
            type: "integer"
            minimum: 0
            maximum: 2147483647
            default: 0
        -
          name: "size"
          in: "query"
          description: "Размер страницы."
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "status"
          in: "query"
          description: "Статус товара."
          schema:
            $ref: "#/components/schemas/ProductStatus"
        -
          name: "category"
          in: "query"
          description: "Категория, точное совпадение."
          schema:
            type: "string"
            minLength: 1
            maxLength: 100
  /products/{id}:
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "Идентификатор ресурса в формате UUID."
        schema:
          type: "string"
          format: "uuid"
          x-go-type: "string"
    get:
      tags:
        - "Products"
      operationId: "getProduct"
      summary: "Получить товар"
      description: "USER, SELLER и ADMIN могут получить любой товар, включая ARCHIVED. PRODUCT_NOT_FOUND при отсутствии товара."
      responses:
        "200":
          description: "Товар найден"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Products"
      operationId: "updateProduct"
      summary: "Обновить товар"
      description: "Полная замена изменяемых характеристик. SELLER может изменять только свои товары, ADMIN — любые, USER получает ACCESS_DENIED. Отсутствующее или null description очищает описание. ID, seller_id и created_at сохраняются; updated_at меняется автоматически. Несуществующий товар не создаётся."
      responses:
        "200":
          description: "Товар обновлён"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
    delete:
      tags:
        - "Products"
      operationId: "archiveProduct"
      summary: "Архивировать товар"
      description: "SELLER может архивировать только свои товары, ADMIN — любые. USER получает ACCESS_DENIED. Запись остаётся в БД со статусом ARCHIVED. Повторное архивирование возвращает 204 без изменения дат."
      responses:
        "204":
          description: "Товар архивирован, тело ответа отсутствует."
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders:
    post:
      tags:
        - "Orders"
      operationId: "createOrder"
      summary: "Создать заказ"
      description: "USER и ADMIN; SELLER получает ACCESS_DENIED. В одной транзакции последовательно проверяются лимит CREATE_ORDER (конфигурируемые N минут), отсутствие заказа CREATED/PAYMENT_PENDING, существование и ACTIVE каждого товара, затем остатки всех позиций. Недостаточные остатки возвращаются полным списком в details.items (product_id, requested, available). После проверок резервируются остатки, фиксируются цены, проверяется и применяется промокод, создаётся заказ CREATED и user_operations. Любая ошибка откатывает все изменения. PERCENTAGE до 70% применяется с округлением до копеек; если процент больше 70, скидка равна 0. FIXED_AMOUNT ограничена полной стоимостью. Итоговые суммы ограничены NUMERIC(12,2)."
      responses:
        "201":
          description: "Заказ создан, остатки зарезервированы"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PromoError"
        "429":
          $ref: "#/components/responses/OrderLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
  /orders/{id}:
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "Идентификатор ресурса в формате UUID."
        schema:
          type: "string"
          format: "uuid"
          x-go-type: "string"
    get:
      tags:
        - "Orders"
      operationId: "getOrder"
      summary: "Получить заказ"
      description: "USER видит только свой заказ (иначе ORDER_OWNERSHIP_VIOLATION). ADMIN видит любой. SELLER получает ACCESS_DENIED. Цены price_at_order сохраняются независимо от изменения текущих цен товаров."
      responses:
        "200":
          description: "Заказ найден"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Orders"
      operationId: "updateOrder"
      summary: "Заменить позиции заказа"
      description: "USER изменяет только свой заказ, ADMIN — любой; SELLER получает ACCESS_DENIED. Последовательно проверяются владелец, статус CREATED и лимит UPDATE_ORDER. В одной транзакции возвращаются прежние остатки, проверяются и резервируются новые позиции и пересчитывается стоимость. Для товаров, уже присутствовавших в заказе, сохраняется прежний price_at_order; для новых товаров фиксируется текущая цена. Существующий промокод проверяется заново с учётом использования данным заказом. При снижении суммы ниже min_order_amount промокод снимается и current_uses уменьшается. Для иных нарушений условий промокода возвращается PROMO_CODE_INVALID с откатом. Затем фиксируется UPDATE_ORDER."
      responses:
        "200":
          description: "Заказ обновлён"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PromoError"
        "429":
          $ref: "#/components/responses/OrderLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
  /orders/{id}/cancel:
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "Идентификатор ресурса в формате UUID."
        schema:
          type: "string"
          format: "uuid"
          x-go-type: "string"
    post:
      tags:
        - "Orders"
      operationId: "cancelOrder"
      summary: "Отменить заказ"
      description: "USER отменяет только свой заказ, ADMIN — любой; SELLER получает ACCESS_DENIED. Отмена разрешена из CREATED и PAYMENT_PENDING. В одной транзакции возвращаются остатки всех позиций, уменьшается current_uses применённого промокода, устанавливается CANCELED. Иные состояния и повторная отмена возвращают INVALID_STATE_TRANSITION."
      responses:
        "200":
          description: "Заказ отменён"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/status:
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "Идентификатор ресурса в формате UUID."
        schema:
          type: "string"
          format: "uuid"
          x-go-type: "string"
    post:
      tags:
        - "Orders"
      operationId: "transitionOrder"
      summary: "Перевести заказ в следующее состояние"
      description: "Только ADMIN. Разрешены CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED. Переход в CANCELED производится через /cancel с возвратом остатков. Переход к тому же статусу, пропуск состояния и обратный переход возвращают INVALID_STATE_TRANSITION."
      responses:
        "200":
          description: "Состояние заказа изменено"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
  /promo-codes:
    post:
      tags:
        - "PromoCodes"
      operationId: "createPromoCode"
      summary: "Создать промокод"
      description: "SELLER и ADMIN; USER получает ACCESS_DENIED. Код уникален, valid_until должен быть строго позже valid_from. current_uses назначается 0. При отсутствии active используется true. Скидка PERCENTAGE больше 70% не применяется: заказ оплачивается по полной цене. Для FIXED_AMOUNT скидка ограничена стоимостью заказа."
      responses:
        "201":
          description: "Промокод создан"
          headers:
            X-Request-Id:
              description: "UUID текущего запроса, генерируется сервером."
              schema:
                type: "string"
                format: "uuid"
                x-go-type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeCreate"
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Access token из /auth/login или /auth/refresh. Claims: sub — ID пользователя, role — USER/SELLER/ADMIN, token_type — access, exp — срок действия. Роли описаны у каждой операции."
  schemas:
    PositiveMoney:
      type: "number"
      format: "decimal"
      minimum: 0.01
      maximum: 9999999999.99
      multipleOf: 0.01
      x-go-type: "decimal.Decimal"
      x-go-type-import:
        name: "decimal"
        path: "github.com/shopspring/decimal"
      description: "Точное десятичное число, до двух знаков после точки; диапазон PostgreSQL NUMERIC(12,2)."
    Money:
      type: "number"
      format: "decimal"
      minimum: 0
      maximum: 9999999999.99
      multipleOf: 0.01
      x-go-type: "decimal.Decimal"
      x-go-type-import:
        name: "decimal"
        path: "github.com/shopspring/decimal"
      description: "Точное десятичное число, до двух знаков после точки; диапазон PostgreSQL NUMERIC(12,2)."
    ProductStatus:
      type: "string"
      enum:
        - "ACTIVE"
        - "INACTIVE"
        - "ARCHIVED"
    OrderStatus:
      type: "string"
      enum:
        - "CREATED"
        - "PAYMENT_PENDING"
        - "PAID"
        - "SHIPPED"
