        - "discount_type"
        - "discount_value"
        - "min_order_amount"
        - "max_uses"
        - "valid_from"
        - "valid_until"
        - "active"
        - "current_uses"
      properties:
        id:
          type: "string"
          format: "uuid"
          x-go-type: "string"
        code:
          type: "string"
          pattern: "^[A-Z0-9_]{4,20}$"
        discount_type:
          $ref: "#/components/schemas/DiscountType"
        discount_value:
          $ref: "#/components/schemas/PositiveMoney"
        min_order_amount:
